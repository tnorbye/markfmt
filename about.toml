# Configuration for cargo-about (https://github.com/EmbarkStudios/cargo-about), which
# generates THIRD-PARTY-LICENSES.txt for release archives (`make licenses`).
#
# `accepted` is also the project's license policy: generation fails if a dependency is not
# available under one of these licenses, so CI rejects incompatible dependencies. All of them
# are permissive and compatible with this project's Apache-2.0 license. For dependencies
# offered under a choice of licenses, the first accepted one listed here is used.
accepted = [
    "Apache-2.0",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
]

# Only the platforms release binaries are built for (see .github/workflows/release.yml).
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Test-only and build-script dependencies are not part of the distributed binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
