# Hooks for https://pre-commit.com. pre-commit builds the binary with `cargo install`.
# Exclude patterns from .markfmt.toml apply to the file names pre-commit passes in.

- id: markfmt
  name: markfmt
  description: Format Markdown, Markdeep, and AI agent instruction files.
  entry: markfmt --quiet --filter-files
  language: rust
  types: [text]
  files: '(?i)(\.(md|markdown|mdown|mkd|mkdn|mdwn|md\.html)$|(^|/)(README|CHANGELOG|CONTRIBUTING|HACKING|SECURITY|PULL_REQUEST_TEMPLATE|RELEASE_NOTES|NEWS)$)'

- id: markfmt-check
  name: markfmt (check only)
  description: Fail if Markdown files are not formatted, without changing them.
  entry: markfmt --check --filter-files
  language: rust
  types: [text]
  files: '(?i)(\.(md|markdown|mdown|mkd|mkdn|mdwn|md\.html)$|(^|/)(README|CHANGELOG|CONTRIBUTING|HACKING|SECURITY|PULL_REQUEST_TEMPLATE|RELEASE_NOTES|NEWS)$)'
