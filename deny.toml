# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny), which checks
# Cargo.lock for known vulnerabilities, unmaintained or yanked crates, and crates from
# unexpected sources (`make deny`). The license policy lives in about.toml instead, so the
# `licenses` check is not run.

[advisories]
# Fail on any RustSec advisory (vulnerability, unsound, or unmaintained) and on yanked crates.
# To accept one deliberately, add its ID with a reason, for example:
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "only affects feature X, which we don't use" }]
yanked = "deny"
ignore = []

[bans]
# Two versions of one crate are worth knowing about but are usually outside our control.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Every dependency must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
