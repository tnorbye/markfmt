# Checks Cargo.lock for known vulnerabilities (RustSec), unmaintained or yanked crates, and
# crates from unexpected sources, as configured in deny.toml. The weekly run catches advisories
# published after a dependency was added, when no code has changed.
name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          # The action's default arguments are `--all-features`; `--locked` keeps the audit on the
          # committed Cargo.lock.
          arguments: --locked --all-features
          command-arguments: advisories bans sources
